# One-click deploy: https://render.com → New → Blueprint → this repo.
# Free tier note (ADR-0003): the instance sleeps when idle; first call
# after a nap takes ~30s. Fine for an instrument; know it's there.
services:
  - type: web
    name: kitchen-inventory
    runtime: python
    plan: free
    buildCommand: pip install "mcp[cli]>=1.17,<2" "psycopg[binary]>=3.1,<4" "pyjwt[crypto]>=2.8,<3"
    startCommand: python server.py
    envVars:
      - key: DATABASE_URL
        sync: false
      # Sign-in (README.md, "Sign-in"). The server refuses to start without all four.
      - key: AUTH_ISSUER
        sync: false
      - key: AUTH_RESOURCE
        sync: false
      - key: AUTH_JWKS_URL
        sync: false
      - key: ALLOWED_USER_IDS
        sync: false
